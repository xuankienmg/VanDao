<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hoạt ảnh tiến cảnh</title>
<link rel="stylesheet" href="/css/base.css"><link rel="stylesheet" href="/css/breakthrough.css">
<style>body{padding:12px}.preview-controls{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.preview-controls button{background:#182a42;color:#e5ecf6;border:1px solid #566b88;padding:7px 10px}.bt-mid{height:600px;max-width:560px;margin:auto}.bt-bottom{display:block;height:54px;text-align:center;color:#d8e8ff;padding:12px;background:#0b1424c9}.bt-plaque{width:80%}h1{font-size:16px;text-align:center}</style>
<div class="preview-controls" id="controls"></div><div class="preview-controls"><button id="advance">Diễn thử đột phá thành công</button><button id="failure">Diễn thử thất bại</button><button id="stage">Thêm một tầng</button><button id="motion">Giảm chuyển động</button></div>
<section class="bt-mid"><div class="bt-stage"><canvas id="btCanvas"></canvas></div><header class="bt-plaque" id="btPlaque"></header><div class="bt-bottom">Chi tiết mới tích lũy qua từng cảnh giới</div></section>
<script>
const $=id=>document.getElementById(id), recvAt=performance.now();let reduce=false;
const DATA={realms:[
{id:'luyen_khi',name:'Luyện Khí',heroMed:'img/med_luyenkhi.png'},
{id:'truc_co',name:'Trúc Cơ',heroMed:'img/med_trucco.png',halo:'img/halo_01.png'},
{id:'kim_dan',name:'Kim Đan',heroMed:'img/med_kimdan.png',halo:'img/halo_02.png'},
{id:'nguyen_anh',name:'Nguyên Anh',heroMed:'img/med_kimdan.png',halo:'img/halo_03.png'},
{id:'hoa_than',name:'Hóa Thần',heroMed:'img/med_kimdan.png',halo:'img/halo_04.png'},
{id:'luyen_hu',name:'Luyện Hư',heroMed:'img/med_luyenhu.png',halo:'img/halo_05.png'}
].map(r=>({...r,stages:Array.from({length:10},(_,i)=>'Tầng '+(i+1))}))};
let S={realm:0,stage:0,qiReq:100,targetCost:[],isPeak:false,hasNext:true,break:{debuffMs:0,cooldownMs:0}};
const realm=()=>DATA.realms[S.realm],curSkin=()=>null,qiNow=()=>0,fmt=String;
</script><script src="/js/breakthrough-evolution.js"></script><script src="/js/breakthrough.js"></script>
<script>
function label(){const r=realm();$('btPlaque').innerHTML='<b>'+r.name+'</b><span>Tầng '+(S.stage+1)+'</span><small class="bt-detail">'+BT_DETAILS.slice(0,S.realm+1).map(d=>d.name).join(' · ')+'</small>';$('btCanvas')._sized=false;}
$('controls').innerHTML=DATA.realms.map((r,i)=>'<button data-realm="'+i+'">'+r.name+'</button>').join('');
$('controls').onclick=e=>{if(!e.target.dataset.realm)return;S.realm=+e.target.dataset.realm;btProc=null;btFx=null;label()};
let pending=null;
$('advance').onclick=()=>{if(pending)clearTimeout(pending);const from=S.realm,target={...S,realm:Math.min(5,from+1),stage:0};btFx=null;btProc={t0:performance.now(),dur:3000};pending=setTimeout(()=>{btProc=null;btFx={kind:'gold',t0:performance.now(),fromRealm:from,target};pending=setTimeout(()=>{S=target;label()},2600)},3000)};
$('failure').onclick=()=>{if(pending)clearTimeout(pending);btProc=null;btFx={kind:'bad',t0:performance.now(),fromRealm:S.realm,target:{...S,realm:Math.min(5,S.realm+1)}};};
$('stage').onclick=()=>{S.stage=(S.stage+1)%10;label()};
$('motion').onclick=()=>{reduce=!reduce;$('motion').textContent=reduce?'Chuyển động đang giảm':'Giảm chuyển động'};
S.realm=Math.max(0,Math.min(5,Number(new URLSearchParams(location.search).get('realm'))||0));label();
</script></html>
