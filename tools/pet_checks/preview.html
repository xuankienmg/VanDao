<!doctype html><html lang="vi" class="panel"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiểm tra bố cục Linh thú</title><base href="/">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/admin.css"><link rel="stylesheet" href="css/window.css"><link rel="stylesheet" href="css/menu-background.css"><link rel="stylesheet" href="css/concept-shell.css"><link rel="stylesheet" href="css/pet.css">
<body class="panel"><aside class="book"><div id="pane-pet" class="pane"></div></aside>
<script>
// Visual fixture only. Never loaded by the game or written to a player save.
const names=['Hỏa Linh Hồ','Băng Tinh Thố','Thanh Mộc Lộc','Kim Giáp Quy','Lôi Vân Điểu','Bích Thủy Giao'];
const ids=['hoa_linh_ho','bang_tinh_tho','thanh_moc_loc','kim_giap_quy','loi_van_dieu','bich_thuy_giao'];
const elements=['hoa','bang','moc','tho','loi','thuy'];
const DATA={petDefs:ids.map((id,i)=>({id,name:names[i],forms:[0,1,2].map((form)=>({name:['Ấu thể','Thành thể','Thần thú'][form],image:`img/pet/${id}_${form}_hd.png`,skillName:'Hỏa Linh Thuật'}))}))};
const S={inventory:{linh_thu_dan:128},pet:{capacity:20,levelCap:80,guardSlots:1,owned:ids.map((id,i)=>({id:String(i),defId:id,name:names[i],element:elements[i],rarity:'uncommon',form:1,formName:'Thành thể',image:`img/pet/${id}_1_hd.png`,level:[32,25,28,22,20,18][i],slot:i===0?1:i===2?2:0,atk:1000,def:400,hp:6000,aptAtk:.92,aptDef:.78,aptHp:.86,shareAtk:150,shareDef:60,shareHp:900,exp:1240,expNeed:2000,talentText:'+3% bạo kích',skillText:'Ngưng tụ linh hỏa, trợ giúp chủ nhân gia tăng uy lực trong chiến đấu.',skillEvery:4})),hatch:[]}};
const ITEM={thu_dan_linh:{name:'Thú Đản · Linh',type:'egg',icon:'img/pet/egg_linh.png'},thu_dan_huyen:{name:'Thú Đản · Huyền',type:'egg',icon:'img/pet/egg_huyen.png'}};
S.inventory.thu_dan_linh=3;S.inventory.thu_dan_huyen=1;S.inventory.linh_thach=5000;
S.pet.hatchSlots=2;S.pet.hatch=[{slot:0,egg:'thu_dan_linh',readyInSeconds:1250,instantCost:250}];
DATA.petDefs.forEach((d,i)=>{d.element=elements[i];d.rarity=i<3?'uncommon':'rare';d.desc='Ấp từ Thú Đản; trưởng thành ở cấp 30 và 60.';d.talentText='+3% bạo kích';});
let busy=false;const fmt=v=>Number(v).toLocaleString('vi-VN');
S.pet.owned[0].level=60;S.pet.owned[0].canEvolve=false;
</script><script src="js/pet.js"></script><script>
// Feed contract probe: this fixture never calls the production API.
let feedBefore;
function notifyHost(){}
function setState(next){Object.assign(S,next);renderPet();}
async function api(method,url){
  if(url.endsWith('/evolve')){
    const id=decodeURIComponent(url.split('/').at(-2)),pet=S.pet.owned.find(p=>p.id===id);
    if(pet.level<60)throw new Error(`Cần linh thú cấp 60 (hiện tại ${pet.level}) · nhân vật đạt Nguyên Anh.`);
    return {message:pet.name+' đã tiến hóa thành Thần thú!',state:{...S,pet:{...S.pet,owned:S.pet.owned.map(p=>p===pet?{...p,form:2,formName:'Thần thú',image:`img/pet/${p.defId}_2_hd.png`}:p)}}};
  }
  if(!url.includes('/feed?'))throw new Error('Bản xem thử chỉ hỗ trợ cho ăn.');
  const root=document.getElementById('pane-pet'),body=root.querySelector('.pet-body');
  feedBefore={body,image:root.querySelector('.pet-portrait img'),top:body.scrollTop,portraitTop:root.querySelector('.pet-portrait').getBoundingClientRect().top,pendingStatus:root.querySelector('.pet-status').textContent};
  await new Promise(resolve=>setTimeout(resolve,250));
  const n=Number(new URL(url,location.href).searchParams.get('n'))||1;
  return {state:{...S,inventory:{...S.inventory,linh_thu_dan:S.inventory.linh_thu_dan-n},pet:{...S.pet,owned:S.pet.owned.map((p,i)=>i? p:{...p,level:p.level+1,exp:p.exp+10})}}};
}
document.addEventListener('click',e=>{
  if(!e.target.closest('[data-pet-action^="feed:"]'))return;
  setTimeout(()=>{
    if(!feedBefore)return;
    const root=document.getElementById('pane-pet');
    document.documentElement.dataset.feedCheck=JSON.stringify({sameBody:feedBefore.body===root.querySelector('.pet-body'),sameImage:feedBefore.image===root.querySelector('.pet-portrait img'),scrollDelta:root.querySelector('.pet-body').scrollTop-feedBefore.top,portraitDelta:root.querySelector('.pet-portrait').getBoundingClientRect().top-feedBefore.portraitTop,pendingStatus:feedBefore.pendingStatus,busy:root.getAttribute('aria-busy'),food:S.inventory.linh_thu_dan,level:S.pet.owned[0].level});
  },500);
});
renderPet();
</script>
