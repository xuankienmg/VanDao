<!doctype html><html lang="vi"><meta charset="utf-8"><title>HP · Vấn Đạo</title><style>body{margin:0;background:#10191d;color:#e9dfcb;font:14px Segoe UI,sans-serif;padding:24px}h1{font:28px Georgia;color:#ebca91}canvas{max-width:100%;display:block;border:1px solid #5d6e61;margin-bottom:14px;image-rendering:pixelated}button{background:#253c32;color:#f5e5c7;border:1px solid #8e9a72;padding:9px 15px;cursor:pointer;margin:0 8px 16px 0}</style><h1>Sinh mệnh · Nhân vật & yêu thú</h1><button id="hit">Nhận sát thương</button><button id="heal">Hồi phục</button><button id="wave">Đợt quái mới</button><button id="round">Trận mới · khiên đầu trận</button><canvas id="stage" width="420" height="300"></canvas><script src="../../wwwroot/js/health-bars.js"></script><script>
const canvas=document.getElementById('stage'),ctx=canvas.getContext('2d'),hero=new Image(),monster=new Image(),dpr=Math.min(2,devicePixelRatio||1);canvas.width=420*dpr;canvas.height=300*dpr;canvas.style.width='420px';canvas.style.height='300px';ctx.setTransform(dpr,0,0,dpr,0,0);hero.src='../../wwwroot/img/hero_kimdan_stand.png';monster.src='../../wwwroot/img/quai_yeu_lang.png';let hp=98600,mp=78600,wave=1,last=0,guard=32000;
function draw(t){const dt=last?(t-last)/1000:0;last=t;ctx.fillStyle='#111d20';ctx.fillRect(0,0,420,300);ctx.fillStyle='#24332d';ctx.fillRect(0,245,420,55);if(hero.complete&&hero.naturalWidth)ctx.drawImage(hero,30,125,125,125);if(monster.complete&&monster.naturalWidth)ctx.drawImage(monster,245,125,125,125);drawBattleHp(ctx,{x:95,y:100,width:110,state:battleHpState('hero','1',hp,98600,dt),name:'Tu sĩ',kind:'hero',shield:guard,rage:.75,viewportWidth:420});drawBattleHp(ctx,{x:307,y:100,width:116,state:battleHpState('enemy',String(wave),mp,123000,dt),name:'Yêu Lang',kind:'enemy',viewportWidth:420});requestAnimationFrame(draw)}
document.getElementById('hit').onclick=()=>{const absorbed=Math.min(guard,24000);guard-=absorbed;hp=Math.max(0,hp-(24000-absorbed));mp=Math.max(0,mp-19000)};document.getElementById('heal').onclick=()=>hp=Math.min(98600,hp+30000);document.getElementById('wave').onclick=()=>{mp=123000;wave++};document.getElementById('round').onclick=()=>{hp=98600;mp=78600;guard=32000;wave++;};requestAnimationFrame(draw);
</script></html>
