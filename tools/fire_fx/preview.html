<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vấn Đạo · Hỏa hệ</title><style>
*{box-sizing:border-box}body{margin:0;background:#10191c;color:#eee4d0;font:14px/1.5 "Segoe UI",sans-serif}main{max-width:1100px;margin:auto;padding:24px}h1{font:32px Georgia;color:#efd09a;margin:0 0 6px}p{color:#a4b4ac;margin:0 0 20px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px}.viewport{min-width:0}.canvas-box{border:1px solid #766447;background:#0d1519;display:grid;place-items:center;min-height:320px;overflow:hidden}canvas{display:block;max-width:100%;height:auto;image-rendering:pixelated}.controls,aside{padding:16px;border:1px solid #465148;background:#182123}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}button,select{background:#29352f;border:1px solid #8d784f;color:#f3ddaf;padding:8px 10px;font:inherit}label{display:flex;gap:6px;align-items:center;font-size:12px}aside label{display:block;margin:0 0 16px}aside select{display:block;width:100%;margin-top:5px}input[type=range]{width:100%;accent-color:#ecc577}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #f0cb80;outline-offset:2px}#status,#metrics{font-size:12px;color:#adbfb0;margin-top:12px}#phase{margin-left:auto;color:#ecd5a3;font-variant-numeric:tabular-nums}small{color:#9fafa7;font-size:12px}.muted{color:#9daca4;font-size:12px;margin-top:16px}@media(max-width:780px){.layout{grid-template-columns:1fr}aside{display:flex;flex-wrap:wrap;gap:12px}aside label{flex:1;min-width:130px;margin:0}aside select{width:100%}}
</style></head><body><main><h1>Đạo hỏa · Thất thức</h1><p>7 chiêu Hỏa · Sprite và renderer dùng trực tiếp trong game</p><div class="layout"><section class="viewport"><div class="canvas-box"><canvas id="stage" width="420" height="300"></canvas></div><div class="controls"><button id="play">Tạm dừng</button><button id="restart">Phát lại</button><label>Tốc độ <select id="speed"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select></label><span id="phase">Tụ lực</span><input type="range" id="scrub" min="0" max="1" step=".001" value="0" aria-label="Tiến độ lượt"></div><div id="status" role="status">Đang tải…</div><div id="metrics"></div></section><aside><label>Chiêu thức<select id="skill"><option value="hoa_cau">Hỏa Cầu</option><option value="liet_diem">Liệt Diễm</option><option value="hoa_long">Hỏa Long Thuật</option><option value="phan_thien">Phần Thiên</option><option value="xich_diem_thien">Xích Diễm Thiên</option><option value="than_hoa" selected>Thần Hỏa Giáng Thế</option><option value="hu_khong_hoa">Hư Không Diễm</option></select></label><label>Cảnh giới<select id="realm"><option value="0">Luyện Khí</option><option value="1">Trúc Cơ</option><option value="2">Kim Đan</option><option value="3">Nguyên Anh</option><option value="4" selected>Hóa Thần</option><option value="5">Luyện Hư</option></select></label><label>Cửa sổ<select id="size"><option value="420">420 × 300 · mặc định</option><option value="840">840 × 600 · ×2</option></select></label><label>Quái<select id="monster"><option value="1">Thường</option><option value="1.5">Boss lớn ×1.5</option></select></label><label><input type="checkbox" id="reduced"> Giảm chuyển động</label><label><input type="checkbox" id="isolated"> Chỉ hiệu ứng</label><button id="benchmark">Đo 100 lượt</button><div class="muted">Bấm Tạm dừng hoặc kéo tiến độ để xem frame. Pha trúng đích bắt đầu ở 45% lượt; từ 75% hiệu ứng tắt.</div></aside></div></main>
<script src="../../wwwroot/js/fire-fx-data.js"></script><script src="../../wwwroot/js/fire-fx.js"></script><script>
const $=id=>document.getElementById(id),canvas=$('stage'),ctx=canvas.getContext('2d'),hero=new Image(),mon=new Image();
const match=matchMedia('(prefers-reduced-motion: reduce)');$('reduced').checked=match.matches;
let playing=!match.matches,progress=0,last=0,elapsed=0,assetRoot='../../wwwroot/';
// Trang QA dùng cùng src với game, quy đổi đường dẫn tương đối từ /tools/fire_fx/.
for(const spec of FIRE_FX_DATA)spec.src=assetRoot+spec.src;
mon.src=assetRoot+'img/quai_yeu_lang.png';
function select(){const r=Number($('realm').value);hero.src=assetRoot+'img/'+(['hero_luyenkhi_stand.png','hero_trucco_stand.png','hero_kimdan_stand.png','hero_kimdan_stand.png','hero_kimdan_stand.png','hero_luyenhu_stand.png'][r]);fireFxAvailable($('skill').value,r);elapsed=0;progress=0;}
function setPlaying(on){playing=on;$('play').textContent=on?'Tạm dừng':'Phát'}
function render(s=progress){
 progress=s;const w=canvas.width,h=canvas.height,gy=h*.82,hh=h*.42,tx=w*.72,hy=gy-hh*.55;
 ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.fillStyle='#0d1519';ctx.fillRect(0,0,w,h);
 if(!$('isolated').checked){ctx.fillStyle='#172425';ctx.fillRect(0,gy,w,h-gy);ctx.strokeStyle='#3b483d';ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(w,gy);ctx.stroke();if(hero.complete&&hero.naturalWidth)ctx.drawImage(hero,w*.2-hh/2,gy-hh,hh,hh);const mh=hh*Number($('monster').value);if(mon.complete&&mon.naturalWidth)ctx.drawImage(mon,tx-mh/2,gy-mh,mh,mh);ctx.font=`${Math.max(10,w/42)}px Segoe UI`;ctx.fillStyle='#c4cdbb';ctx.textAlign='center';ctx.fillText('Tu sĩ',w*.2,gy+h*.08);ctx.fillText('Mục tiêu',tx,gy+h*.08)}
 const skill=$('skill').value,r=Number($('realm').value),drawn=drawFireSkillFx(ctx,skill,s,r,{handX:w*.2+hh*.25,handY:hy,targetX:tx,targetY:gy-hh*Number($('monster').value)*.45,groundY:gy,heroHeight:hh,reducedMotion:$('reduced').checked});
 const p=fireFxPlan(skill,s,r);$('phase').textContent=p?['Tụ lực','Phóng / hiện hình','Trúng đích','Tan biến'][p.phase]+` · ${p.frame+1}/16`:'Nghỉ';$('scrub').value=s;
 $('status').textContent=drawn?`${w}×${h}px · ${fireFxCacheInfo().size}/2 sheet trong cache`:'Đang tải sprite (game dùng hiệu ứng cũ khi tải lỗi)…';return drawn;
}
function tick(now){const dt=last?Math.min(100,now-last):0;last=now;if(playing){elapsed=(elapsed+dt*Number($('speed').value))%2600;progress=Math.min(1,elapsed/2200)}render();requestAnimationFrame(tick)}
$('play').onclick=()=>setPlaying(!playing);$('restart').onclick=()=>{elapsed=0;progress=0;setPlaying(true)};$('scrub').oninput=e=>{setPlaying(false);progress=Number(e.target.value);elapsed=progress*2200;render()};
for(const id of ['skill','realm'])$(id).onchange=select;$('size').onchange=()=>{canvas.width=Number($('size').value);canvas.height=canvas.width*300/420;render()};
async function waitReady(id,r){const start=performance.now();while(!fireFxAvailable(id,r)){if(performance.now()-start>10000)throw Error('Không tải được '+id);await new Promise(resolve=>setTimeout(resolve,20))}}
$('benchmark').onclick=async()=>{setPlaying(false);await waitReady($('skill').value,Number($('realm').value));const samples=[];for(let i=0;i<100;i++){const start=performance.now();for(let f=0;f<16;f++)render(f/16*.749);samples.push((performance.now()-start)/16);if(i%10===0)await new Promise(requestAnimationFrame)}samples.sort((a,b)=>a-b);$('metrics').textContent=`100 lượt / 1600 frame · p95 ${samples[94].toFixed(3)} ms/frame · Cache ${fireFxCacheInfo().size}/2`;};
window.fireQa={render,waitReady,select,stop:()=>setPlaying(false),cache:fireFxCacheInfo};select();setPlaying(playing);requestAnimationFrame(tick);
</script></body></html>
