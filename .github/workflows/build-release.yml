name: Build & Release Game

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v0.7.3)'
        required: false
        default: ''
      force:
        description: 'Force rebuild even if release exists'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine Version & Check Release Status
        shell: pwsh
        run: |
          $inputVer = "${{ github.event.inputs.version }}".Trim()
          $refName = "${{ github.ref_name }}"
          
          # Read <Version> from VanDao.csproj
          $xml = [xml](Get-Content VanDao.csproj)
          $csprojVer = $xml.Project.PropertyGroup.Version.Trim()

          if ($inputVer -ne "") {
            $tag = if ($inputVer.StartsWith("v") -or $inputVer.StartsWith("V")) { $inputVer } else { "v$inputVer" }
          } elseif ($refName -like "v*") {
            $tag = $refName
          } else {
            $tag = if ($csprojVer.StartsWith("v") -or $csprojVer.StartsWith("V")) { $csprojVer } else { "v$csprojVer" }
          }
          
          $cleanVer = $tag.TrimStart('v', 'V')
          Write-Host "Target Tag: $tag (Clean Version: $cleanVer)"
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VERSION=$cleanVer" | Out-File -FilePath $env:GITHUB_ENV -Append

          # Check if this release already exists on GitHub (to avoid rebuilding unchanged versions)
          $force = "${{ github.event.inputs.force }}"
          if ($force -ne "true" -and $refName -eq "master") {
            $token = "${{ secrets.GITHUB_TOKEN }}"
            $repo = "${{ github.repository }}"
            $headers = @{
              "Authorization" = "Bearer $token"
              "User-Agent" = "GitHubActions"
              "Accept" = "application/vnd.github+json"
            }
            try {
              $existing = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/tags/$tag" -Headers $headers -ErrorAction Stop
              if ($existing -and $existing.id) {
                Write-Host ">> Release $tag already exists on GitHub (Version in VanDao.csproj unchanged). Skipping auto-build." -ForegroundColor Yellow
                "SKIP_BUILD=true" | Out-File -FilePath $env:GITHUB_ENV -Append
              }
            } catch {
              Write-Host ">> Release $tag does not exist yet. New version detected from VanDao.csproj! Starting auto-build..." -ForegroundColor Green
              "SKIP_BUILD=false" | Out-File -FilePath $env:GITHUB_ENV -Append
            }
          } else {
            "SKIP_BUILD=false" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Build & Package Game + Launcher
        if: env.SKIP_BUILD != 'true'
        shell: pwsh
        run: |
          $publishDir = "publish_game"
          if (Test-Path $publishDir) { Remove-Item $publishDir -Recurse -Force }

          # 1. Build Single-file Game
          Write-Host "=== 1. Building Game (Single-File) ===" -ForegroundColor Cyan
          dotnet publish VanDao.csproj -c Release -r win-x64 -o $publishDir -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --self-contained false
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Build game failed!" -ForegroundColor Red
            exit 1
          }

          # Clean unnecessary files
          Get-ChildItem -Path $publishDir -Filter "*.pdb" | Remove-Item -Force
          Get-ChildItem -Path $publishDir -Filter "*.xml" | Remove-Item -Force
          if (Test-Path "$publishDir\web.config") { Remove-Item "$publishDir\web.config" -Force }
          if (Test-Path "$publishDir\docs") { Remove-Item "$publishDir\docs" -Recurse -Force }
          if (Test-Path "$publishDir\VanDaoLauncher") { Remove-Item "$publishDir\VanDaoLauncher" -Recurse -Force }
          if (Test-Path "$publishDir\launcher_settings.json") { Remove-Item "$publishDir\launcher_settings.json" -Force }

          # 2. Build Single-file Launcher and include in zip package
          Write-Host "=== 2. Building Launcher ===" -ForegroundColor Cyan
          $launcherPubDir = "publish_launcher"
          dotnet publish VanDaoLauncher/VanDaoLauncher.csproj -c Release -r win-x64 -o $launcherPubDir -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --self-contained false
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Build launcher failed!" -ForegroundColor Red
            exit 1
          }

          Copy-Item "$launcherPubDir\VanDaoLauncher.exe" "$publishDir\VanDaoLauncher.exe" -Force
          New-Item -ItemType Directory -Force -Path "$publishDir\VanDaoLauncher"
          Copy-Item "VanDaoLauncher\wwwroot" "$publishDir\VanDaoLauncher\wwwroot" -Recurse -Force

          # 3. Create release zip
          $zipName = "VanDao_${env:TAG}.zip"
          Write-Host "=== 3. Creating release package: $zipName ===" -ForegroundColor Cyan
          Compress-Archive -Path "$publishDir\*" -DestinationPath $zipName -Force
          $sizeMb = "{0:N2} MB" -f ((Get-Item $zipName).Length / 1MB)
          Write-Host "Archive created successfully: $zipName ($sizeMb)" -ForegroundColor Green

      - name: Publish GitHub Release
        if: env.SKIP_BUILD != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Release ${{ env.TAG }}
          files: VanDao_${{ env.TAG }}.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
