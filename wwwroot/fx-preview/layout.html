<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kiểm tra tuyệt kỹ với quái</title>
<style>body{background:#101c22;color:#e1eee7;font:16px system-ui;margin:32px}h1{font-size:26px}select,button{padding:10px;margin:8px;background:#26453e;color:white;border:1px solid #6a9a82;border-radius:8px}canvas{display:block;width:min(100%,960px);border:1px solid #54716a;border-radius:12px}p{color:#aac3bc}</style>
<h1>Vị trí và tỷ lệ công pháp so với quái</h1><label>Chiêu <select id="skill"></select></label><label>Mục tiêu <select id="enemy"><option value="1">Quái thường</option><option value="1.25">Tinh anh ×1,25</option><option value="1.5">Boss ×1,5</option></select></label><button id="play">Tạm dừng</button><button id="impact">Xem va chạm</button><p>Đường vàng: mặt đất · Chấm đỏ: tâm mục tiêu · Khung nét đứt: ô ảnh quái. Dùng cùng renderer với trận đấu.</p><canvas width="960" height="440"></canvas>
<script src="../js/fire-fx-data.js"></script><script src="../js/water-wood-fx-data.js"></script><script src="../js/fire-fx.js"></script><script>
const sel=document.querySelector('#skill'),enemy=document.querySelector('#enemy'),c=document.querySelector('canvas'),ctx=c.getContext('2d');
for(const s of WATER_WOOD_FX_DATA){const o=document.createElement('option');o.value=s.skillId;o.textContent=s.name;sel.append(o)}sel.value='hon_nguyen_moc';
const wolf=new Image(),boss=new Image(),hero=new Image();wolf.src='../img/quai_yeu_lang_hd.png';boss.src='../img/boss_tu_ty_ma_vien_hd.png';hero.src='../img/hero_trucco_48.png';
// Resolve relative sheet URLs from this review page; production uses root paths.
for(const s of WATER_WOOD_FX_DATA)s.src='../'+s.src;
let playing=true,elapsed=0,last=0;
function tick(now){if(last&&playing)elapsed+=Math.min(100,now-last);last=now;const p=(elapsed%2600)/2200,k=Number(enemy.value),sz=120,msz=sz*k,g=370,x=690;
ctx.clearRect(0,0,960,440);ctx.fillStyle='#14232d';ctx.fillRect(0,0,960,440);ctx.strokeStyle='#b59a59';ctx.beginPath();ctx.moveTo(20,g);ctx.lineTo(940,g);ctx.stroke();
ctx.imageSmoothingEnabled=true;if(hero.complete)ctx.drawImage(hero,180,g-sz,sz,sz);const mon=k===1.5?boss:wolf;if(mon.complete&&mon.naturalWidth)ctx.drawImage(mon,x-msz/2,g-msz,msz,msz);
ctx.save();ctx.setLineDash([5,5]);ctx.strokeStyle='#a6bcb4';ctx.strokeRect(x-msz/2,g-msz,msz,msz);ctx.restore();
drawFireSkillFx(ctx,sel.value,Math.min(1,p),6,{handX:280,handY:300,targetX:x,targetY:g-msz*.5,groundY:g,heroHeight:sz,targetWidth:msz,targetHeight:msz});
ctx.fillStyle='#ff7068';ctx.beginPath();ctx.arc(x,g-msz*.5,4,0,Math.PI*2);ctx.fill();requestAnimationFrame(tick)}requestAnimationFrame(tick);
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Tạm dừng':'Tiếp tục'};document.querySelector('#impact').onclick=()=>{elapsed=1100;playing=false;document.querySelector('#play').textContent='Tiếp tục'};sel.onchange=()=>elapsed=1100;
</script></html>
