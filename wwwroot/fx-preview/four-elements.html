<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vấn Đạo · Bốn hệ công pháp</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1619;color:#e4efea;font:15px system-ui;padding:28px;--bg:#101a25}h1{font-size:28px;margin:0 0 8px}p{color:#afc7bf;line-height:1.6}button,select,input{accent-color:#acdbbc}button,select{padding:10px 14px;background:#213b39;color:inherit;border:1px solid #50766d;border-radius:8px;margin:0 8px 12px 0}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid #d5e79b}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}article{border:1px solid #34514b;border-radius:12px;overflow:hidden;background:#142322}article h2{font-size:16px;margin:12px 14px}article canvas{display:block;width:100%;aspect-ratio:1;background:var(--bg)}small{display:block;margin:10px 14px;color:#a2bcb2}a{color:#8fdac2}.light{--bg:#e5e4db}.gray{--bg:#46504e}header{max-width:1100px;margin-bottom:20px}.controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.controls label{margin:0 12px 12px 0}.arena{max-width:840px;margin:20px 0;border:1px solid #34514b;border-radius:12px;overflow:hidden}.arena canvas{display:block;width:100%;aspect-ratio:2;background:var(--bg)}.arena p{padding:0 16px}.scrub{width:min(500px,90vw);display:block;margin-bottom:18px}article button{margin-left:14px}article a{font-size:13px}article[hidden]{display:none}
</style>
<header><h1>Thổ · Lôi · Băng · Phong</h1>
<p>32 animation, mỗi chiêu 16 khung. Hướng riêng từng chiêu: chưởng ngang, giáng từ trên, trồi từ dưới hoặc bùng phát giữa mục tiêu. Cảnh chiến đấu dùng cùng bộ vẽ với game. <a href="index.html">Xem Thủy · Mộc</a></p>
<div class="controls"><button id="play">Tạm dừng</button><button id="step">Khung kế</button><button id="restart">Phát lại</button>
<select id="element" aria-label="Lọc hệ"><option value="">Tất cả hệ</option><option value="tho" selected>Thổ</option><option value="loi">Lôi</option><option value="bang">Băng</option><option value="gio">Phong</option></select>
<select id="speed" aria-label="Tốc độ"><option value="1">Tốc độ ×1</option><option value="0.5">Tốc độ ×0.5</option><option value="0.25">Tốc độ ×0.25</option></select>
<select id="background" aria-label="Nền"><option value="">Nền tối</option><option value="light">Nền sáng</option><option value="gray">Nền xám</option></select>
<select id="enemySize" aria-label="Kích thước quái"><option value="1">Quái thường</option><option value="0.7">Quái nhỏ</option><option value="1.4">Quái lớn</option></select>
<label><input type="checkbox" id="reduced"> Giảm chuyển động</label></div>
<input class="scrub" id="scrub" type="range" min="0" max="2399" value="0" aria-label="Tiến độ animation"><p id="count"></p></header>
<section class="arena"><canvas id="battle" width="840" height="420" aria-label="Xem trước chiến đấu"></canvas><p id="selected"></p></section><main></main>
<script src="../js/four-elements-fx-data.js"></script><script src="../js/fire-fx.js"></script>
<script>
// Manifest paths are relative to wwwroot, just as in the game.
const NativeImage=window.Image;
window.Image=class extends NativeImage{set src(value){super.src=value.startsWith('img/')?'../'+value:value}get src(){return super.src}};
let playing=true,time=0,last=0;
const cards=[],names={tho:'Thổ',loi:'Lôi',bang:'Băng',gio:'Phong'},directionNames={left:'Trái → phải',above:'Trên ↓ dưới',below:'Dưới ↑ trên',center:'Bùng phát tâm quái'};
let selected=FOUR_ELEMENTS_FX_DATA[0];
const hero=new Image(),monster=new Image();hero.src='img/hero_luyenkhi.png';monster.src='img/quai_yeu_lang_hd.png';
for(const spec of FOUR_ELEMENTS_FX_DATA){
  const card=document.createElement('article'),title=document.createElement('h2'),canvas=document.createElement('canvas'),status=document.createElement('small'),button=document.createElement('button'),link=document.createElement('a'),clip=document.createElement('a');
  title.textContent=spec.name+' · '+names[spec.element]+' · '+directionNames[spec.castDirection];canvas.width=canvas.height=384;
  button.textContent='Xem chiến đấu';button.onclick=()=>{selected=spec;time=0;document.querySelector('.arena').scrollIntoView({block:'nearest',behavior:'smooth'})};
  link.textContent='Sprite sheet PNG';link.href='../'+spec.src;link.target='_blank';link.rel='noopener';
  clip.textContent=' · WebP';clip.href='assets/'+spec.skillId+'.webp';clip.target='_blank';clip.rel='noopener';
  card.append(title,canvas,status,button,link,clip);document.querySelector('main').append(card);cards.push({spec,card,canvas,status,image:null});
}
function filter(){const element=document.querySelector('#element').value;let count=0;for(const item of cards){item.card.hidden=!!element&&item.spec.element!==element;if(!item.card.hidden){count++;if(!item.image){item.image=new Image();item.image.src=item.spec.src}}}document.querySelector('#count').textContent=count+' / 32 animation · Bị động dùng icon tĩnh.';const first=cards.find(item=>!item.card.hidden);if(first){selected=first.spec;time=0}}
function draw(){
  const progress=(time%2400)/2200;
  for(const item of cards){if(item.card.hidden)continue;const {spec,canvas,status,image}=item,ctx=canvas.getContext('2d'),plan=fireFxPlan(spec.skillId,progress,6);ctx.clearRect(0,0,384,384);status.textContent=image&&!image.naturalWidth&&image.complete?'Lỗi tải ảnh':plan?'Khung '+(plan.frame+1)+'/16 · '+['Tụ lực','Thi triển','Va chạm','Tan biến'][plan.phase]:'Nghỉ';if(plan&&image?.complete&&image.naturalWidth){ctx.imageSmoothingEnabled=true;ctx.drawImage(image,plan.frame%4*192,Math.floor(plan.frame/4)*192,192,192,0,0,384,384)}}
  const c=document.querySelector('#battle'),g=c.getContext('2d'),ground=354,height=146,enemy=height*Number(document.querySelector('#enemySize').value);g.clearRect(0,0,c.width,c.height);g.fillStyle='#4b5d50';g.fillRect(0,ground,c.width,2);
  if(hero.complete&&hero.naturalWidth)g.drawImage(hero,140,ground-height,height,height);
  if(monster.complete&&monster.naturalWidth)g.drawImage(monster,640-enemy/2,ground-enemy,enemy,enemy);
  const ready=fireFxAvailable(selected.skillId,6);
  if(ready)drawFireSkillFx(g,selected.skillId,progress,6,{handX:244,handY:ground-height*.55,targetX:640,targetY:ground-enemy/2,groundY:ground,heroHeight:height,targetWidth:enemy,targetHeight:enemy,reducedMotion:document.querySelector('#reduced').checked});
  document.querySelector('#selected').textContent=selected.name+' · '+names[selected.element]+' · '+directionNames[selected.castDirection]+(ready?'':' · Đang tải ảnh…');document.querySelector('#scrub').value=String(time%2400);
}
function tick(now){if(last&&playing)time+=Math.min(100,now-last)*Number(document.querySelector('#speed').value);last=now;draw();requestAnimationFrame(tick)}
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Tạm dừng':'Tiếp tục'};
document.querySelector('#step').onclick=()=>{playing=false;document.querySelector('#play').textContent='Tiếp tục';time=(Math.floor(time/100)+1)*100};
document.querySelector('#restart').onclick=()=>time=0;
document.querySelector('#background').onchange=e=>document.body.className=e.target.value;
document.querySelector('#element').onchange=filter;
document.querySelector('#scrub').oninput=e=>{playing=false;document.querySelector('#play').textContent='Tiếp tục';time=Number(e.target.value)};
filter();requestAnimationFrame(tick);
</script></html>
