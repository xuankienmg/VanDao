<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Công pháp Thủy · Mộc — Animation</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1619;color:#e4efea;font:16px system-ui;padding:32px}h1{font-size:28px;margin-bottom:8px}p{color:#afc7bf}button,select{padding:10px 16px;background:#213b39;color:inherit;border:1px solid #50766d;border-radius:8px;margin:0 8px 16px 0}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}article{border:1px solid #34514b;border-radius:14px;overflow:hidden;background:#142322}h2{font-size:17px;margin:14px 16px}canvas{display:block;width:100%;aspect-ratio:1;background:var(--bg,#111b25)}small{display:block;margin:12px 16px;color:#a2bcb2}a{color:#8fdac2}.light{--bg:#e5e4db}.checker{--bg:#46504e}header{max-width:1000px;margin-bottom:24px}
</style>
<header><h1>Công pháp Thủy · Mộc</h1><p>Sprite sinh bằng AI · 16 khung mỗi chiêu · Tụ lực → thi triển → va chạm → tan. <a href="four-elements.html">Xem 32 chiêu Thổ · Lôi · Băng · Phong →</a></p>
<button id="play">Tạm dừng</button><button id="step">Khung kế</button><button id="restart">Phát lại</button><select id="speed"><option value="1">Tốc độ ×1</option><option value="0.5">Tốc độ ×0.5</option><option value="0.25">Tốc độ ×0.25</option></select><select id="background"><option value="">Nền tối</option><option value="light">Nền sáng</option><option value="checker">Nền xám</option></select><p id="count"></p></header><main></main>
<script src="../js/water-wood-fx-data.js"></script><script>
let playing=true,time=0,last=0;const cards=[];
for(const s of WATER_WOOD_FX_DATA){const a=document.createElement('article'),h=document.createElement('h2'),c=document.createElement('canvas'),f=document.createElement('small');h.textContent=s.name+' · '+(s.element==='thuy'?'Thủy':'Mộc');c.width=c.height=384;f.textContent='';a.append(h,c,f);document.querySelector('main').append(a);const image=new Image();image.src='../'+s.src;cards.push({s,c,f,image});}
document.querySelector('#count').textContent=cards.length+' animation đã đóng gói. Các công pháp bị động dùng hình tĩnh.';
function draw(){for(const {s,c,f,image} of cards){const ctx=c.getContext('2d');ctx.clearRect(0,0,384,384);const k=Math.floor(time/s.frameMs)%24;f.textContent=k<16?'Khung '+(k+1)+'/16':'Nghỉ';if(k>=16||!image.complete||!image.naturalWidth)continue;ctx.imageSmoothingEnabled=true;ctx.drawImage(image,k%4*192,Math.floor(k/4)*192,192,192,0,0,384,384);}}
function tick(now){if(last&&playing)time+=Math.min(100,now-last)*Number(document.querySelector('#speed').value);last=now;draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Tạm dừng':'Tiếp tục'};document.querySelector('#step').onclick=()=>{playing=false;document.querySelector('#play').textContent='Tiếp tục';time+=100};document.querySelector('#restart').onclick=()=>time=0;document.querySelector('#background').onchange=e=>document.body.className=e.target.value;
</script></html>
